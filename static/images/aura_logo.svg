<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft, Glassy Circular Background -->
  <circle cx="100" cy="100" r="98" fill="url(#glassGradient)" />
  
  <!-- Subtle Inner Ring/Glow -->
  <circle cx="100" cy="100" r="85" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Text: AURA -->
  <text x="100" y="105" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="800" font-size="52" fill="white" letter-spacing="2" style="filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.2));">
    AURA
  </text>
  
  <!-- Text: HR -->
  <text x="100" y="145" text-anchor="middle" font-family="'Cairo', sans-serif" font-weight="400" font-size="28" fill="#e2e8f0" letter-spacing="4">
    HR
  </text>

  <!-- Definitions -->
  <defs>
    <linearGradient id="glassGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a4fba" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
</svg>
